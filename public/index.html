<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Heures</title>
<meta name="description" content="Trente minutes pour comprendre le jour : monde, France, savoirs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500&family=Unbounded:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#2A2D31; --charcoal-2:#34383D; --charcoal-3:#4A4F55;
  --ivory:#F4EFE2; --ivory-2:#E8E1CF; --ivory-3:#D8CFB8;
  --teal:#0D4C52; --teal-2:#156A70; --teal-glow:#5FB3AE;
  --muted:#6B6F74;
  --bg:var(--ivory); --fg:#24272B; --fg-soft:#55595F; --rule:var(--ivory-3);
  --panel:var(--ivory-2); --accent:var(--teal); --on-accent:var(--ivory);
  --display:"Unbounded",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#222529; --fg:#EDE7D8; --fg-soft:#A9AAA6; --rule:#3A3E44; --panel:#2C3035; --accent:var(--teal-glow); --on-accent:#13292B;
  }
}
:root[data-theme="dark"]{--bg:#222529; --fg:#EDE7D8; --fg-soft:#A9AAA6; --rule:#3A3E44; --panel:#2C3035; --accent:var(--teal-glow); --on-accent:#13292B;}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:19px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal-glow);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px} body{font-size:18px}}

/* ───── HERO ───── */
.hero{background:var(--charcoal);color:var(--ivory);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1200px 600px at 85% 30%, rgba(21,106,112,.35), transparent 60%);pointer-events:none}
.mast{display:flex;justify-content:space-between;align-items:center;padding:22px 0;position:relative;z-index:2}
.wordmark{white-space:nowrap;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark i{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid var(--teal-glow);position:relative}
.wordmark i::after{content:"";position:absolute;left:50%;top:2px;width:3px;height:7px;background:var(--ivory);transform:translateX(-50%);border-radius:2px}
.mast-actions{display:flex;gap:6px}
.chip{font-family:var(--display);font-size:13px;font-weight:500;padding:9px 14px;border-radius:999px;border:1px solid rgba(244,239,226,.22);transition:background .2s,border-color .2s}
.chip:hover{background:rgba(244,239,226,.08);border-color:rgba(244,239,226,.45)}

.hero-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;grid-template-areas:"eph head head" "eph sub dial";column-gap:56px;row-gap:8px;align-items:start;padding:36px 0 64px;position:relative;z-index:2}
.g-eph{grid-area:eph}.g-head{grid-area:head}.g-sub{grid-area:sub;padding-top:18px}.g-dial{grid-area:dial;margin-top:-30px}
@media (max-width:1100px){.hero-grid{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"eph head" "eph sub" "dial dial"}.g-dial{margin-top:20px}}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr;grid-template-areas:"eph" "head" "sub" "dial";row-gap:24px;padding-bottom:40px}.g-sub{padding-top:0}}

/* ephemeris */
.eph-stack{position:relative;width:250px;height:310px;perspective:1200px}
@media (max-width:900px){.eph-stack{margin:0 auto}}
.eph{position:absolute;inset:0;background:var(--ivory);color:var(--charcoal);border-radius:6px 6px 10px 10px;
  box-shadow:0 1px 0 #cfc6af, 0 3px 0 #e4dcc6, 0 5px 0 #cfc6af, 0 24px 50px -10px rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;padding:0 0 18px;transform-origin:50% 0;overflow:hidden}
.eph-top{width:100%;height:46px;background:var(--teal);display:flex;align-items:center;justify-content:center;gap:90px;position:relative}
.eph-top span{width:12px;height:12px;border-radius:50%;background:var(--charcoal);box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.eph-wd{font-family:var(--display);font-weight:700;font-size:15px;margin-top:16px;color:var(--teal)}
.eph-day{font-family:var(--display);font-weight:900;font-size:148px;line-height:.95;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.eph-month{font-family:var(--display);font-weight:500;font-size:14px;margin-top:6px}
.eph-saint{font-style:italic;font-size:15px;color:var(--muted);margin-top:auto}
.eph-perf{position:absolute;left:0;right:0;top:46px;height:6px;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(42,45,49,.18) 6px 9px)}
.eph-nav{display:flex;justify-content:space-between;margin-top:18px;width:250px}
@media (max-width:900px){.eph-nav{margin:18px auto 0}}
.eph-nav button{font-family:var(--display);font-size:12px;font-weight:500;opacity:.8;padding:6px 2px}
.eph-nav button:disabled{opacity:.25;cursor:default}
.eph-nav button:not(:disabled):hover{opacity:1;color:var(--teal-glow)}

/* dial + headline */
.headline{font-family:var(--display);font-weight:900;font-size:clamp(30px,4.1vw,60px);line-height:1.02;letter-spacing:-.04em;max-width:22ch;text-wrap:balance}
.headline .w{display:inline-block;will-change:transform}
.hero-sub{font-size:20px;line-height:1.5;color:rgba(244,239,226,.72);margin-top:22px;max-width:38ch;font-style:italic}
.start{margin-top:30px;display:inline-flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:15px;background:var(--ivory);color:var(--charcoal);padding:15px 22px;border-radius:999px;transition:transform .2s var(--ease)}
.start:hover{transform:translateY(-2px)}
.start:active{transform:scale(.97)}
.dial-wrap{position:relative;width:100%;max-width:400px;justify-self:center;margin:0 auto}
.dial{width:100%;height:auto;display:block;overflow:visible}
.dial .seg{cursor:pointer}
.dial .seg-track{stroke:rgba(244,239,226,.10);transition:stroke .25s}
.dial .seg:hover .seg-track,.dial .seg:focus-visible .seg-track{stroke:rgba(244,239,226,.2)}
.dial .seg.active .seg-track{stroke:rgba(95,179,174,.22)}
.dial .seg-fill{stroke:var(--teal-glow)}
.dial .seg-label{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ivory);letter-spacing:.02em;pointer-events:none}
.dial .tick{stroke:rgba(244,239,226,.35)}
.dial .tick.major{stroke:var(--ivory)}
.dial .center-big{font-family:var(--display);font-weight:900;font-size:86px;fill:var(--ivory);letter-spacing:-.05em}
.dial .center-small{font-family:var(--serif);font-style:italic;font-size:19px;fill:rgba(244,239,226,.7)}
.dial .hand{fill:var(--ivory)}
.dial .seg:focus{outline:none}

/* ───── STICKY BAR ───── */
.bar{position:sticky;top:0;z-index:30;background:var(--charcoal);color:var(--ivory);border-bottom:1px solid #1d1f22}
.bar-in{display:flex;align-items:center;gap:22px;height:62px}
.bar-date{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{position:relative;font-family:var(--display);font-weight:500;font-size:14px;padding:10px 14px 12px;border-radius:10px;color:rgba(244,239,226,.62);transition:color .2s;white-space:nowrap}
.tab:hover{color:var(--ivory)}
.tab[aria-selected="true"]{color:var(--ivory)}
.tab .prog{position:absolute;left:14px;right:14px;bottom:6px;height:3px;background:rgba(244,239,226,.12);border-radius:2px;overflow:hidden}
.tab .prog b{display:block;height:100%;width:0;background:var(--teal-glow);transition:width .3s}
.score{font-family:var(--display);font-size:13px;font-weight:500;white-space:nowrap;color:rgba(244,239,226,.75)}
.score strong{color:var(--teal-glow);font-weight:900;font-size:16px}
@media (max-width:640px){.bar-date{display:none}.tab{padding:10px 10px 12px;font-size:13px}.tab .prog{left:10px;right:10px}.bar-in{gap:10px}}

/* ───── CHAPTER ───── */
#chapter{min-height:100vh;padding-top:72px;padding-bottom:120px}
@media (max-width:640px){#chapter{padding-top:48px}.block{padding:22px 18px}.block h4 span{display:none}}
.ch-head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;margin-bottom:64px}
@media (max-width:820px){.ch-head{grid-template-columns:1fr;gap:12px}}
.ch-time{font-family:var(--display);font-weight:500;font-size:14px;color:var(--fg-soft);padding-top:18px}
.ch-time b{display:block;font-weight:900;font-size:44px;color:var(--accent);letter-spacing:-.04em;line-height:1}
.ch-title{font-family:var(--display);font-weight:900;font-size:clamp(56px,10vw,132px);line-height:.9;letter-spacing:-.055em}
.lede{list-style:none;margin-top:30px;display:grid;gap:14px;max-width:62ch}
.lede li{font-size:22px;line-height:1.42;padding-left:30px;position:relative}
.lede li::before{content:"";position:absolute;left:0;top:.62em;width:16px;height:3px;background:var(--accent);border-radius:2px}

.art{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding:48px 0;border-top:1px solid var(--rule)}
@media (max-width:820px){.art{grid-template-columns:1fr;gap:14px;padding:36px 0}}
.art-side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@media (max-width:820px){.art-side{flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px}}
.kicker{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent);line-height:1.35}
.mins{font-family:var(--display);font-size:12px;color:var(--fg-soft)}
.readbtn{font-family:var(--display);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--rule);border-radius:999px;transition:background .2s,border-color .2s,color .2s}
.readbtn .box{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.readbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.readbtn[aria-pressed="true"] .box::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.art h3{font-family:var(--display);font-weight:700;font-size:clamp(25px,3vw,36px);line-height:1.12;letter-spacing:-.03em;max-width:24ch}
.chapo{font-style:italic;font-size:22px;line-height:1.45;color:var(--fg-soft);margin-top:16px;max-width:58ch}
.body{margin-top:22px;max-width:64ch}
.body p+p{margin-top:1em}
.body p{hyphens:auto;-webkit-hyphens:auto}
.critique{margin-top:28px;max-width:64ch;background:var(--charcoal);color:var(--ivory);border-radius:4px 18px 18px 4px;padding:22px 26px 24px;position:relative;border-left:6px solid var(--teal-glow)}
.critique h4{font-family:var(--display);font-weight:700;font-size:13px;color:var(--teal-glow);margin-bottom:8px}
.critique p{font-size:18px;line-height:1.55}
.sources{margin-top:18px;font-size:14px;color:var(--fg-soft);font-family:var(--display);display:flex;flex-wrap:wrap;gap:6px 14px}
.sources a{text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:1px}
.sources a:hover{color:var(--accent);border-color:var(--accent)}

/* board */
.board{margin:8px 0 0;padding:44px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px}
@media (max-width:820px){.board{grid-template-columns:1fr;gap:14px}}
.brows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
@media (max-width:640px){.brows{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto 130px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--rule);font-family:var(--display);font-size:14px}
.brow .lab{font-weight:500}
.brow .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar-d{position:relative;height:22px}
.bar-d::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--fg-soft);opacity:.5}
.bar-d i{position:absolute;top:6px;height:10px;border-radius:2px}
.bar-d i.up{left:50%;background:var(--accent)}
.bar-d i.down{right:50%;background:var(--fg-soft)}
.bar-d em{position:absolute;top:2px;font-style:normal;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.bnote{grid-column:1/-1;font-size:14px;color:var(--fg-soft);font-style:italic;margin-top:14px}

/* interactive zone */
.play{margin-top:24px;padding:64px 0 0;border-top:6px solid var(--fg)}
.play-title{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,60px);letter-spacing:-.045em;line-height:1}
.play-sub{font-style:italic;color:var(--fg-soft);margin-top:10px;font-size:20px}
.play-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:40px}
@media (max-width:900px){.play-grid{grid-template-columns:minmax(0,1fr)}}
.block{background:var(--panel);border-radius:22px;padding:30px;position:relative}
.block h4{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px}
.block h4 span{color:var(--fg-soft);font-weight:500}
.block.wide{grid-column:1/-1}

/* estimate */
.est-q{font-size:23px;line-height:1.4;max-width:46ch}
.est-row{display:flex;align-items:center;gap:26px;margin-top:28px;flex-wrap:wrap}
.est-read{font-family:var(--display);font-weight:900;font-size:64px;letter-spacing:-.05em;line-height:1;color:var(--accent);min-width:3.4ch;font-variant-numeric:tabular-nums}
.est-track{flex:1;min-width:220px;position:relative;padding:18px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:var(--rule);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--fg);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--fg);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:5px solid var(--bg);box-shadow:0 0 0 2px var(--fg);cursor:grab}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--fg),0 0 0 6px var(--teal-glow)}
.est-mark{position:absolute;top:2px;width:3px;height:40px;background:var(--accent);border-radius:2px;opacity:0;transform:translateX(-50%)}
.est-mark::after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:12px;font-weight:900;color:var(--accent);white-space:nowrap}
.btn{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:14px;padding:13px 20px;border-radius:999px;background:var(--fg);color:var(--bg);transition:transform .15s var(--ease),opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.reveal{margin-top:22px;font-size:18px;line-height:1.55;max-width:62ch;display:none}
.reveal strong{font-family:var(--display);font-size:15px}

/* flashcards */
.deck{position:relative;height:260px;perspective:1400px;margin:6px 0 22px}
.card{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:26px;display:flex;flex-direction:column}
.front{background:var(--teal);color:var(--ivory);justify-content:space-between}
.front .term{font-family:var(--display);font-weight:900;font-size:clamp(24px,3vw,34px);line-height:1.05;letter-spacing:-.035em}
.front .hint{font-size:15px;font-style:italic;opacity:.7}
.back{background:var(--bg);color:var(--fg);transform:rotateY(180deg);box-shadow:inset 0 0 0 2px var(--teal);justify-content:center;font-size:18px;line-height:1.5}
.back .t{font-family:var(--display);font-weight:700;font-size:13px;color:var(--accent);margin-bottom:8px}
.deck-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.deck-count{margin-left:auto;font-family:var(--display);font-size:13px;color:var(--fg-soft)}

/* quiz */
.qz-q{font-size:22px;line-height:1.4;min-height:2.8em}
.qz-choices{display:grid;gap:10px;margin-top:20px}
.qz-c{text-align:left;font-size:18px;padding:14px 18px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--rule);display:flex;gap:14px;align-items:center;transition:box-shadow .2s,background .2s}
.qz-c:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--fg)}
.qz-c b{font-family:var(--display);font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);flex:none}
.qz-c.ok{background:var(--teal);color:var(--ivory);box-shadow:none}
.qz-c.ok b{background:var(--ivory);color:var(--teal)}
.qz-c.ko{box-shadow:inset 0 0 0 2px var(--fg);text-decoration:line-through;text-decoration-thickness:1.5px}
.qz-c:disabled{cursor:default}
.qz-exp{margin-top:16px;font-size:17px;line-height:1.5;color:var(--fg-soft);display:none}
.qz-foot{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.qz-dots{display:flex;gap:6px}
.qz-dots i{width:22px;height:5px;border-radius:3px;background:var(--rule)}
.qz-dots i.ok{background:var(--accent)}
.qz-dots i.ko{background:var(--fg)}
.qz-end{text-align:center;padding:30px 0}
.qz-end .big{font-family:var(--display);font-weight:900;font-size:96px;letter-spacing:-.06em;line-height:1;color:var(--accent)}

.next-ch{margin-top:80px;display:flex;justify-content:flex-end}
.next-ch button{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,64px);letter-spacing:-.045em;line-height:1;text-align:right;padding:10px 0}
.next-ch button small{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:18px;letter-spacing:0;color:var(--fg-soft);margin-bottom:6px}
.next-ch button:hover span{color:var(--accent)}

footer{background:var(--charcoal);color:rgba(244,239,226,.6);font-size:15px;padding:40px 0;font-style:italic}

/* wipe */
.wipe{position:fixed;inset:0;z-index:80;background:var(--teal);color:var(--ivory);display:flex;align-items:center;justify-content:center;pointer-events:none;clip-path:inset(0 0 0 100%);visibility:hidden}
.wipe span{font-family:var(--display);font-weight:900;font-size:clamp(70px,17vw,260px);letter-spacing:-.06em;line-height:.9}

/* drawer */
.drawer{position:fixed;inset:0;z-index:90;display:none}
.drawer .scrim{position:absolute;inset:0;background:rgba(20,22,24,.55)}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ivory);color:var(--charcoal);padding:28px;overflow:auto}
.drawer h2{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:-.04em;margin-bottom:6px}
.drawer p.s{font-style:italic;color:var(--muted);margin-bottom:22px}
.arch{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--ivory-3);text-decoration:none;width:100%;text-align:left}
.arch .mini{background:var(--charcoal);color:var(--ivory);border-radius:8px;text-align:center;padding:8px 0 6px;font-family:var(--display)}
.arch .mini b{display:block;font-size:28px;font-weight:900;line-height:1}
.arch .mini small{font-size:10px}
.arch.cur .mini{background:var(--teal)}
.arch span{font-size:16px;line-height:1.35}
.arch:hover span{color:var(--teal)}
.close{position:absolute;top:22px;right:22px;font-family:var(--display);font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--charcoal)}

.err{padding:120px 0;text-align:center;font-family:var(--display)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="mast">
      <div class="wordmark"><i aria-hidden="true"></i>six heures</div>
      <div class="mast-actions">
        <button class="chip" id="openArch" type="button">Archives</button>
        <button class="chip" id="themeBtn" type="button" aria-label="Changer de thème">Thème</button>
      </div>
    </div>
    <div class="hero-grid">
      <div class="g-eph">
        <div class="eph-stack" id="ephStack" aria-live="polite"></div>
        <div class="eph-nav">
          <button type="button" id="prevDay">Veille</button>
          <button type="button" id="nextDay">Lendemain</button>
        </div>
      </div>
      <h1 class="headline g-head" id="headline"></h1>
      <div class="g-sub">
        <p class="hero-sub">Trente minutes, trois cadrans : le monde, la France, et de quoi apprendre quelque chose.</p>
        <button class="start" type="button" id="startBtn">Commencer la lecture</button>
      </div>
      <div class="dial-wrap g-dial"><svg class="dial" id="dial" viewBox="-16 -16 472 472" role="group" aria-label="Cadran de lecture : trois chapitres de dix minutes"></svg></div>
    </div>
  </div>
</header>

<nav class="bar" aria-label="Chapitres">
  <div class="wrap bar-in">
    <div class="bar-date" id="barDate"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="score" id="score"></div>
  </div>
</nav>

<main id="chapter" class="wrap" role="tabpanel" tabindex="-1"></main>

<footer><div class="wrap">Six Heures. Rédigé chaque matin à partir de sources publiques, citées sous chaque article. Les chiffres de marché sont ceux de la dernière clôture.</div></footer>

<div class="wipe" id="wipe" aria-hidden="true"><span id="wipeTxt"></span></div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="archTitle">
  <div class="scrim" data-close></div>
  <div class="panel">
    <button class="close" type="button" data-close>Fermer</button>
    <h2 id="archTitle">Archives</h2>
    <p class="s">Chaque matin, une nouvelle feuille.</p>
    <div id="archList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasG = typeof gsap !== 'undefined';
if (hasG && typeof ScrollTrigger !== 'undefined') gsap.registerPlugin(ScrollTrigger);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
/* theme */
(function(){ const t = store.get('sh-theme', null); if (t) document.documentElement.dataset.theme = t; })();
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx; store.set('sh-theme', nx);
};

let INDEX = [], ED = null, cur = 0, state = null, dialAngle = 0, st = null;

/* ── routing ── */
function wantedDate(){
  const m = location.pathname.match(/(\d{4}-\d{2}-\d{2})/);
  if (m) return m[1];
  const q = new URLSearchParams(location.search).get('d');
  return q || (location.hash.match(/\d{4}-\d{2}-\d{2}/)||[])[0] || null;
}
async function getJSON(u){ const r = await fetch(u, {cache:'no-cache'}); if(!r.ok) throw new Error(u); return r.json(); }

async function boot(){
  try { INDEX = await getJSON('editions/index.json'); } catch(e){ INDEX = []; }
  INDEX.sort((a,b)=> b.date.localeCompare(a.date));
  const d = wantedDate() || (INDEX[0] && INDEX[0].date);
  await load(d, true);
}

async function load(date, first){
  let ed;
  try { ed = await getJSON('editions/' + date + '.json'); }
  catch(e){ $('#chapter').innerHTML = '<p class="err">Cette édition n\'existe pas encore. Ouvre les archives pour choisir un autre jour.</p>'; return; }
  ED = ed;
  state = store.get('sh-' + ed.date, {prog:{}, read:{}, quiz:{}, est:{}});
  document.title = 'Six Heures · ' + fmtShort(ed.date);
  renderEph(first);
  renderHeadline(first);
  renderDial(first);
  renderTabs();
  renderArchive();
  cur = 0;
  renderChapter(0, true);
  updateScore();
  const i = INDEX.findIndex(x => x.date === ed.date);
  $('#prevDay').disabled = i < 0 || i >= INDEX.length - 1;
  $('#nextDay').disabled = i <= 0;
}
const save = () => store.set('sh-' + ED.date, state);
const fmtShort = d => { const [y,m,dd] = d.split('-'); return (+dd) + ' ' + MONTHS[+m-1] + ' ' + y; };

/* ── ephemeris ── */
function ephHTML(ed){
  const [y,m,d] = ed.date.split('-');
  return `<div class="eph"><div class="eph-top"><span></span><span></span></div><div class="eph-perf"></div>
    <div class="eph-wd">${esc(ed.weekday)}</div><div class="eph-day">${+d}</div>
    <div class="eph-month">${MONTHS[+m-1]} ${y}</div><div class="eph-saint">${esc(ed.saint||'')}</div></div>`;
}
function renderEph(first){
  const stack = $('#ephStack');
  const old = stack.querySelector('.eph');
  stack.insertAdjacentHTML('afterbegin', ephHTML(ED));
  const fresh = stack.querySelector('.eph');
  if (old && hasG && !RM){
    gsap.to(old, {rotationX: -75, y: 220, rotation: gsap.utils.random(-14, 14), opacity: 0, duration: .85, ease: 'power2.in', onComplete: () => old.remove()});
  } else if (old) old.remove();
  if (first && hasG && !RM) gsap.from(fresh, {y: -40, opacity: 0, rotationX: 30, duration: 1, ease: 'power3.out', delay: .1});
}

/* ── headline ── */
function renderHeadline(first){
  const h = $('#headline');
  h.innerHTML = ED.headline.split(' ').map(w => `<span class="w">${esc(w)}</span>`).join(' ');
  if (hasG && !RM) gsap.from(h.querySelectorAll('.w'), {yPercent: 110, opacity: 0, duration: .9, stagger: .035, ease: 'power4.out', delay: first ? .25 : 0});
}

/* ── dial ── */
const CX = 220, CY = 220, R = 160;
const pol = (r, a) => { const t = (a - 90) * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; };
const arc = (r, a0, a1) => { const [x0,y0] = pol(r,a0), [x1,y1] = pol(r,a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
function renderDial(first){
  const svg = $('#dial'), chs = ED.chapters, n = chs.length, span = 360 / n, gap = 3;
  let s = '<defs>';
  chs.forEach((c,i)=>{ const a0 = i*span+gap, a1 = (i+1)*span-gap;
    // label path: bottom segments reversed so text reads upright
    const mid = (a0+a1)/2, bottom = mid > 90 && mid < 270;
    const lp = bottom ? (()=>{ const [x0,y0]=pol(R,a1-6),[x1,y1]=pol(R,a0+6); return `M${x0} ${y0} A${R} ${R} 0 0 0 ${x1} ${y1}`; })() : arc(R, a0+6, a1-6);
    s += `<path id="lp${i}" d="${lp}"/>`; });
  s += '</defs>';
  for (let k = 0; k < 30; k++){ const a = k*12, major = k%5===0; const [x0,y0] = pol(major?196:200, a), [x1,y1] = pol(208, a);
    s += `<line class="tick${major?' major':''}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke-width="${major?2.5:1.2}"/>`; }
  [0,10,20].forEach((m,i)=>{ const [x,y] = pol(226, i*120); s += `<text x="${x}" y="${y+5}" text-anchor="middle" style="font-family:Unbounded;font-size:12px;font-weight:700;fill:rgba(244,239,226,.55)">${m}′</text>`; });
  chs.forEach((c,i)=>{ const a0 = i*span+gap, a1 = (i+1)*span-gap, mid=(a0+a1)/2, bottom = mid > 90 && mid < 270;
    s += `<g class="seg" data-i="${i}" tabindex="0" role="button" aria-label="${esc(c.name)}, ${c.minutes} minutes">
      <path class="seg-track" d="${arc(R,a0,a1)}" fill="none" stroke-width="44" stroke-linecap="butt"/>
      <path class="seg-fill" d="${arc(R,a0,a1)}" fill="none" stroke-width="44" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
      <text class="seg-label" dy="${bottom? 5 : 5}"><textPath href="#lp${i}" startOffset="50%" text-anchor="middle">${esc(c.name)}</textPath></text></g>`; });
  s += `<text class="center-big" x="${CX}" y="${CY+18}" text-anchor="middle" id="dialMin">30</text>
        <text class="center-small" x="${CX}" y="${CY+50}" text-anchor="middle" id="dialSub">minutes de lecture</text>
        <g id="hand"><path class="hand" d="M${CX-9} ${CY-100} L${CX} ${CY-134} L${CX+9} ${CY-100} Z"/></g>`;
  svg.innerHTML = s;
  svg.querySelectorAll('.seg').forEach(g => {
    g.addEventListener('click', () => goChapter(+g.dataset.i, true));
    g.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); goChapter(+g.dataset.i, true);} });
  });
  updateDialFills(first);
  if (first && hasG && !RM){
    gsap.from(svg.querySelectorAll('.seg-track'), {opacity:0, scale:.85, transformOrigin:'220px 220px', duration:.9, stagger:.12, ease:'power3.out', delay:.2});
    gsap.from(svg.querySelectorAll('.tick'), {opacity:0, duration:.4, stagger:.012, delay:.3});
    gsap.fromTo('#hand', {rotation:-30, svgOrigin:'220 220'}, {rotation:60, svgOrigin:'220 220', duration:1.6, ease:'elastic.out(1,.55)', delay:.55});
    dialAngle = 60;
  } else { setHand(0, false); }
}
function setHand(i, anim){
  const span = 360 / ED.chapters.length, target = i*span + span/2;
  let nx = target; while (nx < dialAngle) nx += 360; // always clockwise, like a clock
  if (nx - dialAngle >= 360) nx -= 360;
  dialAngle = nx;
  if (hasG && anim && !RM) gsap.to('#hand', {rotation: nx, svgOrigin:'220 220', duration: 1.1, ease:'elastic.out(1,.6)'});
  else if (hasG) gsap.set('#hand', {rotation: nx, svgOrigin:'220 220'});
  else $('#hand').setAttribute('transform', `rotate(${nx} 220 220)`);
  document.querySelectorAll('#dial .seg').forEach((g,k)=> g.classList.toggle('active', k===i));
  const c = ED.chapters[i];
  $('#dialSub').textContent = c.name + ' · ' + c.minutes + ' min';
}
function chProg(id){
  const c = ED.chapters.find(x=>x.id===id); const scroll = state.prog[id] || 0;
  const reads = c.articles.filter((a,k)=> state.read[id+':'+k]).length / c.articles.length;
  const q = state.quiz[id]; const qp = q ? Object.keys(q.ans||{}).length / c.quiz.length : 0;
  return Math.min(1, scroll*.5 + reads*.3 + qp*.2);
}
function updateDialFills(){
  document.querySelectorAll('#dial .seg').forEach((g,i)=>{ const p = chProg(ED.chapters[i].id);
    const f = g.querySelector('.seg-fill');
    if (hasG && !RM) gsap.to(f, {attr:{'stroke-dashoffset': 1-p}, duration:.6, ease:'power2.out'}); else f.setAttribute('stroke-dashoffset', 1-p); });
  document.querySelectorAll('.tab').forEach((t,i)=>{ t.querySelector('.prog b').style.width = (chProg(ED.chapters[i].id)*100)+'%'; });
  const total = ED.chapters.reduce((s,c)=> s + chProg(c.id)*c.minutes, 0);
  const left = Math.max(0, Math.round(ED.chapters.reduce((s,c)=>s+c.minutes,0) - total));
  $('#dialMin').textContent = left;
}

/* ── tabs ── */
function renderTabs(){
  $('#barDate').textContent = ED.weekday + ' ' + fmtShort(ED.date);
  $('#tabs').innerHTML = ED.chapters.map((c,i)=>`<button class="tab" role="tab" id="tab-${c.id}" aria-selected="${i===0}" aria-controls="chapter" data-i="${i}">${esc(c.name)}<span class="prog"><b></b></span></button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => goChapter(+t.dataset.i, false));
  $('#tabs').onkeydown = e => { if (e.key==='ArrowRight'||e.key==='ArrowLeft'){ const n = ED.chapters.length; const i = (cur + (e.key==='ArrowRight'?1:-1) + n) % n; goChapter(i,false); document.querySelectorAll('.tab')[i].focus(); } };
}
function updateScore(){
  let ok=0, tot=0; ED.chapters.forEach(c=>{ tot += c.quiz.length; const q = state.quiz[c.id]; if (q) ok += Object.values(q.ans||{}).filter(Boolean).length; });
  $('#score').innerHTML = `Quiz <strong>${ok}</strong>/${tot}`;
}

/* ── chapter navigation with wipe ── */
let busy = false;
function goChapter(i, fromDial){
  if (busy) return;
  const scrollTo = () => { const y = document.querySelector('.bar').getBoundingClientRect().top + scrollY; window.scrollTo({top: y, behavior: RM ? 'auto' : 'instant'}); };
  if (i === cur){ scrollTo(); return; }
  if (!hasG || RM){ cur = i; renderChapter(i); scrollTo(); return; }
  busy = true;
  const w = $('#wipe'); $('#wipeTxt').textContent = ED.chapters[i].name;
  const tl = gsap.timeline({onComplete:()=>{ busy=false; gsap.set(w,{visibility:'hidden'}); }});
  tl.set(w, {visibility:'visible', clipPath:'inset(0 0 0 100%)'})
    .to(w, {clipPath:'inset(0 0 0 0%)', duration:.5, ease:'power4.inOut'})
    .fromTo('#wipeTxt', {xPercent:30, opacity:0}, {xPercent:0, opacity:1, duration:.45, ease:'power3.out'}, '-=.25')
    .add(()=>{ cur = i; renderChapter(i); scrollTo(); })
    .to('#wipeTxt', {xPercent:-30, opacity:0, duration:.35, ease:'power2.in'}, '+=.1')
    .to(w, {clipPath:'inset(0 100% 0 0)', duration:.55, ease:'power4.inOut'}, '-=.15');
}

function renderChapter(i, init){
  const c = ED.chapters[i];
  document.querySelectorAll('.tab').forEach((t,k)=> t.setAttribute('aria-selected', k===i));
  setHand(i, !init);
  const main = $('#chapter');
  main.setAttribute('aria-labelledby', 'tab-' + c.id);
  const arts = c.articles.map((a,k)=>`
    <article class="art">
      <div class="art-side">
        <div class="kicker">${esc(a.kicker)}</div>
        <div class="mins">${a.minutes} min</div>
        <button class="readbtn" type="button" data-k="${k}" aria-pressed="${!!state.read[c.id+':'+k]}"><span class="box"></span>Lu</button>
      </div>
      <div>
        <h3>${esc(a.title)}</h3>
        <p class="chapo">${esc(a.chapo)}</p>
        <div class="body">${a.body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
        ${a.critique ? `<aside class="critique"><h4>Regard critique</h4><p>${esc(a.critique)}</p></aside>` : ''}
        ${a.sources && a.sources.length ? `<div class="sources">Sources ${a.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('')}</div>` : ''}
      </div>
    </article>`).join('');
  const board = c.board ? `<section class="board" aria-label="Marchés">
      <div class="art-side"><div class="kicker">Le tableau</div><div class="mins">Dernières clôtures</div></div>
      <div><div class="brows">${c.board.map(b=>{ const w = Math.max(3, Math.min(28, Math.abs(b.change) / (Math.abs(b.change)>5?20:2) * 28));
        return `<div class="brow"><span class="lab">${esc(b.label)}</span><span class="val">${esc(b.value)}</span>
          <span class="bar-d" aria-label="${b.change>0?'+':''}${b.change} %"><i class="${b.change>=0?'up':'down'}" style="width:${w}%"></i>
          <em style="${b.change>=0?`left:calc(50% + ${w}% + 4px)`:`right:calc(50% + ${w}% + 4px)`}">${b.change>0?'+':''}${String(b.change).replace('.',',')}</em></span></div>`; }).join('')}</div>
        ${c.boardNote?`<p class="bnote">${esc(c.boardNote)}</p>`:''}</div></section>` : '';
  const nx = ED.chapters[(i+1) % ED.chapters.length];
  const last = i === ED.chapters.length - 1;
  main.innerHTML = `
    <header class="ch-head">
      <div class="ch-time"><b>${c.minutes}′</b>de lecture</div>
      <div><h2 class="ch-title">${esc(c.name)}</h2>
        <ul class="lede">${c.lede.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>
    </header>
    ${c.id === ED.chapters[0].id && board ? '' : ''}
    ${arts}
    ${board}
    <section class="play" aria-label="Exercices">
      <h3 class="play-title">À toi de jouer</h3>
      <p class="play-sub">Ce que tu retiens vraiment, en trois minutes.</p>
      <div class="play-grid">
        <div class="block wide" id="est"></div>
        <div class="block" id="fc"></div>
        <div class="block" id="qz"></div>
      </div>
    </section>
    <div class="next-ch"><button type="button" id="nextCh">${last?'<small>Édition terminée</small><span>Revenir au cadran</span>':`<small>Chapitre suivant</small><span>${esc(nx.name)}</span>`}</button></div>`;
  main.querySelectorAll('.readbtn').forEach(b => b.onclick = () => {
    const key = c.id+':'+b.dataset.k; state.read[key] = !state.read[key]; b.setAttribute('aria-pressed', !!state.read[key]); save(); updateDialFills();
    if (hasG && !RM && state.read[key]) gsap.fromTo(b, {scale:.9}, {scale:1, duration:.4, ease:'back.out(3)'});
  });
  $('#nextCh').onclick = () => last ? window.scrollTo({top:0, behavior: RM?'auto':'smooth'}) : goChapter(i+1, false);
  renderEstimate(c); renderDeck(c); renderQuiz(c);
  updateDialFills();
  if (st) st.kill();
  if (typeof ScrollTrigger !== 'undefined'){
    st = ScrollTrigger.create({trigger: main, start:'top top', end:'bottom bottom', onUpdate: self => {
      if (self.progress > (state.prog[c.id]||0) + .02){ state.prog[c.id] = Math.min(1, self.progress); save(); updateDialFills(); } }});
    ScrollTrigger.refresh();
  }
}

/* ── estimate ── */
function renderEstimate(c){
  const e = c.estimate, el = $('#est'), done = state.est[c.id];
  const mid = done ? done.v : Math.round((e.min + e.max) / 2 / e.step) * e.step;
  el.innerHTML = `<h4>Ordre de grandeur <span>glisse, puis valide</span></h4>
    <p class="est-q">${esc(e.question)}</p>
    <div class="est-row"><div class="est-read" id="estRead">${mid}${esc(e.unit)}</div>
      <div class="est-track"><input type="range" id="estIn" min="${e.min}" max="${e.max}" step="${e.step}" value="${mid}" aria-label="Ton estimation"><div class="est-mark" id="estMark" data-v="${e.answer}${esc(e.unit)}"></div></div>
      <button class="btn" type="button" id="estBtn">Valider</button></div>
    <div class="reveal" id="estRev"></div>`;
  const inp = $('#estIn'), rd = $('#estRead');
  inp.oninput = () => rd.textContent = inp.value + e.unit;
  const show = (v, anim) => {
    const pct = (e.answer - e.min) / (e.max - e.min) * 100, mk = $('#estMark');
    mk.style.left = `calc(${pct}% + ${(0.5 - pct/100) * 30}px)`;
    const diff = Math.abs(v - e.answer), rng = e.max - e.min, verdict = diff <= rng*.04 ? 'Dans le mille.' : diff <= rng*.12 ? 'Pas loin.' : 'Écart notable.';
    const rv = $('#estRev'); rv.innerHTML = `<strong>${verdict} Réponse : ${e.answer}${esc(e.unit)}.</strong> ${esc(e.explain)}`; rv.style.display = 'block';
    inp.disabled = true; $('#estBtn').disabled = true;
    if (hasG && anim && !RM){ gsap.fromTo(mk, {opacity:0, scaleY:0}, {opacity:1, scaleY:1, duration:.6, ease:'back.out(2)'}); gsap.from(rv, {opacity:0, y:10, duration:.5}); }
    else mk.style.opacity = 1;
  };
  $('#estBtn').onclick = () => { const v = +inp.value; state.est[c.id] = {v}; save(); show(v, true); };
  if (done) show(done.v, false);
}

/* ── flashcards ── */
function renderDeck(c){
  const el = $('#fc'); let order = c.flashcards.map((_,k)=>k), known = 0, flipped = false;
  el.innerHTML = `<h4>Flashcards <span id="fcCount"></span></h4><div class="deck" id="deck"></div>
    <div class="deck-actions"><button class="btn ghost" type="button" id="fcFlip">Retourner</button>
    <button class="btn ghost" type="button" id="fcAgain" disabled>À revoir</button><button class="btn" type="button" id="fcKnow" disabled>Je savais</button></div>`;
  const deck = $('#deck');
  const draw = () => {
    deck.innerHTML = order.slice(0,3).map((k,pos)=>{ const f = c.flashcards[k];
      return `<div class="card" data-pos="${pos}" style="z-index:${10-pos}" ${pos===0?'tabindex="0" role="button" aria-label="Carte : '+esc(f.front)+'. Appuie pour retourner."':''}>
        <div class="face front"><div class="term">${esc(f.front)}</div><div class="hint">Touche pour voir la définition</div></div>
        <div class="face back"><div class="t">${esc(f.front)}</div>${esc(f.back)}</div></div>`; }).reverse().join('');
    deck.querySelectorAll('.card').forEach(cd => { const p = +cd.dataset.pos; const t = {y: p*12, scale: 1 - p*.045, rotationY:0, rotation: p? (p%2? 2:-2):0};
      hasG ? gsap.set(cd, t) : cd.style.transform = `translateY(${p*12}px) scale(${1-p*.045})`; });
    flipped = false; $('#fcAgain').disabled = $('#fcKnow').disabled = !order.length;
    $('#fcFlip').disabled = !order.length;
    $('#fcCount').textContent = order.length ? `${known} sue${known>1?'s':''} · ${order.length} restante${order.length>1?'s':''}` : '';
    if (!order.length) deck.innerHTML = `<div class="qz-end"><div class="big">${known}</div><p>cartes maîtrisées. Reviens demain : il y en aura d'autres.</p></div>`;
    const top = deck.querySelector('.card[data-pos="0"]');
    if (top){ top.onclick = flip; top.onkeydown = ev => { if (ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); flip(); } }; }
  };
  const flip = () => { const top = deck.querySelector('.card[data-pos="0"]'); if (!top) return; flipped = !flipped;
    if (hasG && !RM) gsap.to(top, {rotationY: flipped?180:0, duration:.7, ease:'power3.inOut'}); else if (hasG) gsap.set(top,{rotationY: flipped?180:0}); else top.style.transform = flipped?'rotateY(180deg)':''; };
  const next = (ok) => { const top = deck.querySelector('.card[data-pos="0"]'); const k = order.shift(); if (ok) known++; else order.push(k);
    const fin = () => draw();
    if (hasG && !RM && top) gsap.to(top, {x: ok? 420 : -420, rotation: ok? 18 : -18, opacity:0, duration:.45, ease:'power2.in', onComplete: fin}); else fin(); };
  $('#fcFlip').onclick = flip; $('#fcKnow').onclick = () => next(true); $('#fcAgain').onclick = () => next(false);
  draw();
}

/* ── quiz ── */
function renderQuiz(c){
  const el = $('#qz'); const qs = state.quiz[c.id] || (state.quiz[c.id] = {ans:{}});
  let idx = Object.keys(qs.ans).length;
  const dots = () => `<div class="qz-dots">${c.quiz.map((_,k)=>`<i class="${k in qs.ans ? (qs.ans[k]?'ok':'ko') : ''}"></i>`).join('')}</div>`;
  const draw = () => {
    if (idx >= c.quiz.length){ const ok = Object.values(qs.ans).filter(Boolean).length;
      el.innerHTML = `<h4>Quiz <span>terminé</span></h4><div class="qz-end"><div class="big">${ok}/${c.quiz.length}</div><p>${ok===c.quiz.length?'Sans faute.':ok>=c.quiz.length-1?'Solide.':'Relis les encadrés critiques, ils contiennent les réponses.'}</p></div>
        <div class="qz-foot">${dots()}<button class="btn ghost" type="button" id="qzRe">Recommencer</button></div>`;
      $('#qzRe').onclick = () => { qs.ans = {}; idx = 0; save(); updateScore(); updateDialFills(); draw(); };
      if (hasG && !RM) gsap.from(el.querySelector('.big'), {scale:.6, opacity:0, duration:.7, ease:'back.out(2.5)'});
      return; }
    const q = c.quiz[idx];
    el.innerHTML = `<h4>Quiz <span>${idx+1} / ${c.quiz.length}</span></h4><p class="qz-q">${esc(q.q)}</p>
      <div class="qz-choices">${q.choices.map((ch,k)=>`<button class="qz-c" type="button" data-k="${k}"><b>${'ABCD'[k]}</b>${esc(ch)}</button>`).join('')}</div>
      <p class="qz-exp" id="qzExp" aria-live="polite"></p>
      <div class="qz-foot">${dots()}<button class="btn" type="button" id="qzNext" disabled>${idx===c.quiz.length-1?'Voir le score':'Question suivante'}</button></div>`;
    el.querySelectorAll('.qz-c').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, good = k === q.answer; qs.ans[idx] = good; save(); updateScore(); updateDialFills();
      el.querySelectorAll('.qz-c').forEach(x => { x.disabled = true; const kk = +x.dataset.k; if (kk===q.answer) x.classList.add('ok'); else if (kk===k) x.classList.add('ko'); });
      const ex = $('#qzExp'); ex.textContent = (good?'Exact. ':'Raté. ') + q.explain; ex.style.display='block';
      el.querySelector('.qz-dots').outerHTML = dots();
      $('#qzNext').disabled = false; $('#qzNext').focus();
      if (hasG && !RM){ const okb = el.querySelector('.qz-c.ok'); gsap.fromTo(okb, {scale:.97}, {scale:1, duration:.5, ease:'elastic.out(1,.4)'});
        const kob = el.querySelector('.qz-c.ko'); if (kob) gsap.fromTo(kob, {x:-6}, {x:0, duration:.4, ease:'elastic.out(1,.3)'}); }
    });
    $('#qzNext').onclick = () => { idx++; draw(); };
    if (hasG && !RM) gsap.from(el.querySelectorAll('.qz-q, .qz-c'), {y:12, opacity:0, duration:.4, stagger:.05, ease:'power2.out'});
  };
  draw();
}

/* ── archive ── */
function renderArchive(){
  $('#archList').innerHTML = INDEX.map(x=>{ const [y,m,d] = x.date.split('-');
    return `<button class="arch${x.date===ED.date?' cur':''}" type="button" data-d="${x.date}"><div class="mini"><b>${+d}</b><small>${MONTHS[+m-1].slice(0,4)}. ${y.slice(2)}</small></div><span>${esc(x.headline)}</span></button>`; }).join('') || '<p>Aucune archive pour l\'instant.</p>';
  document.querySelectorAll('.arch').forEach(b => b.onclick = () => { closeDrawer(); nav(b.dataset.d); });
}
let lastFocus = null;
function openDrawer(){ lastFocus = document.activeElement; const d = $('#drawer'); d.style.display = 'block';
  if (hasG && !RM){ gsap.from(d.querySelector('.panel'), {xPercent:100, duration:.55, ease:'power4.out'}); gsap.from(d.querySelector('.scrim'), {opacity:0, duration:.3}); gsap.from(d.querySelectorAll('.arch'), {x:30, opacity:0, stagger:.04, delay:.15, duration:.4}); }
  d.querySelector('.close').focus(); }
function closeDrawer(){ const d = $('#drawer'); d.style.display = 'none'; if (lastFocus) lastFocus.focus(); }
$('#openArch').onclick = openDrawer;
$('#drawer').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeDrawer(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#drawer').style.display==='block') closeDrawer();
  if (e.key==='Tab' && $('#drawer').style.display==='block'){ const f = [...$('#drawer').querySelectorAll('button')]; const a = f[0], z = f[f.length-1];
    if (e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } } });

function nav(date){
  if (!date || (ED && date === ED.date)) return;
  try { history.pushState({}, '', '?d=' + date); } catch(e){}
  window.scrollTo({top:0, behavior: RM?'auto':'smooth'});
  load(date, false);
}
$('#prevDay').onclick = () => { const i = INDEX.findIndex(x=>x.date===ED.date); if (INDEX[i+1]) nav(INDEX[i+1].date); };
$('#nextDay').onclick = () => { const i = INDEX.findIndex(x=>x.date===ED.date); if (i>0) nav(INDEX[i-1].date); };
addEventListener('popstate', () => { const d = wantedDate() || INDEX[0]?.date; if (d && d!==ED?.date) load(d, false); });
$('#startBtn').onclick = () => goChapter(cur, false);

boot();
})();
</script>
